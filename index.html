<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="แอปจัดการทัวร์และดูแลลูกทัวร์หน้างาน" />
    <title>MyTour</title>
    <!-- ตั้งโหมดสว่าง/มืดก่อน React จะ render
         ถ้ารอ React ผู้ใช้จะเห็นจอขาวแวบนึงแล้วค่อยมืด ซึ่งแสบตามากตอนกลางคืน
         ตรรกะต้องตรงกับ resolveMode() ใน src/lib/colorMode.js -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('mytour_color_mode')
          var dark =
            saved === 'dark' ||
            (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) {
            document.documentElement.setAttribute('data-mode', 'dark')
            document.documentElement.style.colorScheme = 'dark'
          }
        } catch (e) {
          /* localStorage ถูกบล็อก — ใช้โหมดสว่างไปก่อน */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
